name: wanderlog
description: "Diário visual de viagens da agência Mundo Afora."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: 4.4.0
  firebase_auth: 6.1.4
  cloud_firestore: 6.1.2
  firebase_storage: 13.0.6
  image_picker: ^1.2.3
  mime: ^2.1.0
  geolocator: 14.0.2
  # Preserva compatibilidade com AGP 8.11.1, Gradle 8.14 e Kotlin 2.2.20.
  geolocator_android: 5.0.2
  path_provider: 2.1.5
  path_provider_android: 2.2.17
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.1.0+1

flutter:
  uses-material-design: true
